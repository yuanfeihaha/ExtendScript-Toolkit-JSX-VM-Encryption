<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESTK JSX VM 加密构建器</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M8 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/><path d="M12 12h.01"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="i-zap" viewBox="0 0 24 24"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
      <symbol id="i-file-code" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 12.5 8 15l2 2.5"/><path d="m14 12.5 2 2.5-2 2.5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 12.5-9.17 4.16a2 2 0 0 1-1.66 0L2 12.5"/><path d="m22 17.5-9.17 4.16a2 2 0 0 1-1.66 0L2 17.5"/></symbol>
    </svg>

    <header class="app-bar">
      <div class="brand">
        <span class="brand-mark"><svg class="icon"><use href="#i-shield"/></svg></span>
        <span class="brand-text">
          <span class="brand-name">ESTK JSX VM</span>
          <span class="brand-sub">加密构建器</span>
        </span>
      </div>
      <div class="app-bar-note">源码在浏览器本地编译与加密，不会上传</div>
      <div class="engine" id="engineStatus" title="构建引擎状态">
        <span class="engine-dot"></span><span id="engineText">引擎就绪</span>
      </div>
    </header>

    <section class="settings-bar" aria-label="构建设置">
      <div class="setting setting-key">
        <label class="setting-label" for="keyInput"><svg class="icon"><use href="#i-key"/></svg>构建密钥</label>
        <div class="control">
          <input id="keyInput" type="password" value="ESTK-JSX-VM-v1" spellcheck="false" autocomplete="off">
          <button id="toggleKeyButton" class="icon-button" type="button" title="显示密钥" aria-label="显示密钥">
            <svg class="icon"><use href="#i-eye" id="keyIconUse"/></svg>
          </button>
        </div>
      </div>

      <div class="setting setting-seed">
        <label class="setting-label" for="seedInput"><svg class="icon"><use href="#i-dice"/></svg>随机种子</label>
        <div class="control">
          <input id="seedInput" type="text" placeholder="留空则每次随机" spellcheck="false" autocomplete="off">
          <button id="randomSeedButton" class="icon-button" type="button" title="生成随机种子" aria-label="生成随机种子">
            <svg class="icon"><use href="#i-dice"/></svg>
          </button>
        </div>
      </div>

      <div class="setting setting-out">
        <label class="setting-label" for="outputName"><svg class="icon"><use href="#i-file-code"/></svg>输出文件名</label>
        <input id="outputName" type="text" value="script.protected.jsx" spellcheck="false" autocomplete="off">
      </div>

      <div class="setting setting-protection">
        <label class="setting-label" for="protectionSelect"><svg class="icon"><use href="#i-shield"/></svg>保护等级</label>
        <select id="protectionSelect" title="保护等级决定混淆强度与运行时开销">
          <option value="standard">标准 · 最快</option>
          <option value="hardened" selected>强化 · 默认</option>
          <option value="maximum">极限 · 最强</option>
        </select>
      </div>

      <div class="setting-actions">
        <button class="btn" id="loadButton" type="button" title="打开 JSX 文件">
          <svg class="icon"><use href="#i-folder"/></svg><span>打开</span>
        </button>
        <button class="btn" id="clearButton" type="button" title="清空编辑器">
          <svg class="icon"><use href="#i-trash"/></svg><span>清空</span>
        </button>
        <span class="divider"></span>
        <button class="btn primary" id="buildButton" type="button" title="编译并加密 (Ctrl+Enter)">
          <svg class="icon"><use href="#i-zap"/></svg><span>生成加密 JSX</span>
        </button>
        <button class="btn icon-only" id="copyButton" type="button" disabled title="复制加密代码" data-tip="复制加密代码" aria-label="复制加密代码">
          <svg class="icon"><use href="#i-copy"/></svg>
        </button>
        <button class="btn icon-only" id="downloadButton" type="button" disabled title="下载文件 (Ctrl+S)" data-tip="下载文件 (Ctrl+S)" aria-label="下载文件">
          <svg class="icon"><use href="#i-download"/></svg>
        </button>
      </div>

      <input id="fileInput" type="file" accept=".jsx,.js,text/javascript" hidden>
    </section>

    <main class="workspace" id="workspace">
      <section class="pane pane-source">
        <div class="pane-bar">
          <span class="pane-title"><svg class="icon"><use href="#i-file-code"/></svg>JSX 源码</span>
          <span class="pane-meta" id="sourceMeta">未载入文件</span>
        </div>
        <div class="editor-wrap" id="dropZone">
          <div class="gutter-clip"><div class="gutter" id="gutter"></div></div>
          <div class="code-clip"><pre class="highlight" id="highlightLayer" aria-hidden="true"></pre></div>
          <textarea
            id="sourceEditor"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            wrap="off"
            placeholder="将 JSX 文件拖到这里，或直接粘贴源码。"
          ></textarea>
          <div class="drop-hint"><svg class="icon"><use href="#i-download"/></svg>松开以载入 JSX</div>
        </div>
        <div class="diagnostics" id="diagnostics">
          <div class="diag-list" id="diagList"></div>
        </div>
      </section>

      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" title="拖动调整分栏宽度"></div>

      <section class="pane pane-result">
        <div class="pane-bar">
          <span class="pane-title"><svg class="icon"><use href="#i-lock"/></svg>加密代码</span>
          <span class="pane-meta" id="buildStatus">等待生成</span>
        </div>
        <div class="stats" id="statsOutput" aria-live="polite">
          <span class="stat empty">尚未构建</span>
        </div>
        <pre id="resultOutput" class="result-output" tabindex="0">生成后将在这里显示完整的加密 JSX。</pre>
      </section>
    </main>

    <script src="vendor/acorn.js"></script>
    <script src="vendor/opcodes.js"></script>
    <script src="vendor/cipher.js"></script>
    <script src="vendor/bytecode.js"></script>
    <script src="vendor/compiler.js"></script>
    <script src="runtime-template.js"></script>
    <script src="vm-builder.js"></script>
    <script src="app.js"></script>
  </body>
</html>
